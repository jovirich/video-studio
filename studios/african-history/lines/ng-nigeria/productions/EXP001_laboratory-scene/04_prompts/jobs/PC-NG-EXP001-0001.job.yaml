prompt: 'A single invented adult figure, presenting male, apparent age 38-42. Deep
  brown skin. Short tightly coiled black hair with a low even profile and a clearly
  visible natural hairline. Short, neatly maintained full beard and moustache. Long-oval
  face, moderately broad nose, pronounced cheekbones, deep-set dark brown eyes, strong
  jaw. A small vertical scar through the outer third of the RIGHT eyebrow, clearly
  resolved. Lean, strong working build with defined shoulders. Neutral expression.
  Plain neutral mid-grey background, featureless, no environment, no props. Composition:
  Head and upper shoulders. Near-frontal view, camera at eye level. Face centred and
  fully visible. Nothing across or obscuring the face. Hairline fully in frame, including
  the temples. Camera: Eye level, near-frontal, 85mm equivalent, moderate depth of
  field with the whole face in focus. No motion blur. Light: Even neutral lighting,
  soft and frontal, from a broad source. No dramatic shadows, no rim, no colour cast.
  Both sides of the face evenly exposed so that skin tone can be measured off the
  cheek. Palette: Natural. No cinematic grading. Nothing that materially changes skin
  tone. Texture: Natural skin texture retained — pores, fine lines, the scar''s edge.
  Not smoothed, not beautified. Mood: neutral, documentary, unstyled. Avoid: any change
  of garment between shots, convergence toward B in face, build, or silhouette, loss
  or displacement of the right-eyebrow scar, footwear of modern construction, eyeglasses,
  wristwatch, any manufactured object, dramatic lighting, rim light, coloured gel,
  heavy grade, smoothed or airbrushed skin, motion blur, shallow focus on the eyes
  only, hat, headwear, glasses, jewellery, hand or object across the face, patterned
  or embroidered cloth, environment, props, background detail.'
