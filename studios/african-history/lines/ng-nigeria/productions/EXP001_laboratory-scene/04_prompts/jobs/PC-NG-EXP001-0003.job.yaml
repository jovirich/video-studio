  tool marks and finger runs visible in raking light. Beaten earth floor, polished
  by use near the bench and dusty at the edges. Timber rafters above, in shadow. Beyond
  the yard doorway: a walled yard, open sky, and the canopy of a single tree above
  the wall line. Period detail: rammed earth wall with visible hand finishing, split,
  unplaned timber, unglazed hand-formed clay, undyed hand-woven cloth, twisted plant-fibre
