# --- Language register ---------------------------------------------------
# CANDIDATE ENTRIES ONLY. Nothing here is confirmed.
#
# These are production decisions about what appears on screen, not claims
# about the region. The Cultural Advisor confirms, removes, or adds
# entries; the Showrunner sets the production language
# (studio.yaml decision `production_language`, unresolved).
#
# `tonal` is deliberately absent from every entry. It is a boolean the
# schema will accept, and recording it without research would be recording
# a finding this studio has not made. It is populated per language when the
# language's own entry in languages/ is written, and it matters: a tonal
# language mispronounced by tone frequently produces a different word, and
# pack 09 §4 treats that as a factual error.
#
# The union of diacritic coverage across the CONFIRMED entries is what
# determines typeface selection, and therefore blocks all brand design.
# See brand/README.md §3.
languages:
  - name: English
    iso639_3: "TBD — Cultural Advisor"
    script: "TBD — Cultural Advisor"
    orthography_standard: "TBD — Cultural Advisor"
    style_guide: "TBD — languages/ entry not yet written"

  - name: Hausa
