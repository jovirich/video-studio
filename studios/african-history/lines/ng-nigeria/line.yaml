# =========================================================================
# Production line control record — Nigeria (line 01, African History Studio)
#
# Validated against standards/schemas/production_line.schema.json by
# `python -m studio_ops validate --schemas`.
#
# -------------------------------------------------------------------------
# WHAT MUST BECOME TRUE BEFORE `line_status` CAN BE `open`
# -------------------------------------------------------------------------
# `line_status: open` is the only value that permits greenlighting a
# production. Reaching it requires all three `opening_conditions` to be
# `true` — the three conditions in bible/00_charter.md §2:
#
#   1. research_lead_named        A named research lead with domain
#                                 competence has agreed to own this line.
#                                 Not "someone will pick it up".
#   2. advisory_contact_agreed    At least one advisory contact with
#                                 standing in the region has agreed to
#                                 review, on recorded terms — fee, credit,
#                                 review rights, right to withdraw.
#                                 See advisory/README.md.
#   3. archive_landscape_surveyed The archive landscape has been surveyed
#                                 and recorded in sources/archive_landscape.md,
#                                 including what could NOT be reached.
#
# THE SCHEMA ENFORCES THIS. The `allOf` block in
# production_line.schema.json makes `line_status: open` fail validation
# while any condition is false, so the check is not a convention someone
# can decide to skip under deadline — it is a red build.
#
# Condition 2 is the one that gets skipped under enthusiasm. Skipping it is
# the most reliable way to produce work that insults the people it claims
# to honour, and it is not recoverable after publication.
#
# Separately and additionally: the studio bible is NOT RATIFIED
# (bible/amendment_log.md) and eleven studio decisions are `unresolved`
# (studio.yaml). No production may be greenlit while either is true, even
# if all three conditions above become satisfied first.
#
# -------------------------------------------------------------------------
# NO HISTORICAL CONTENT
# -------------------------------------------------------------------------
# This record contains no claim about the past. Every substantive field is
# `TBD` with a named owner. Facts enter this line only as claim records
# under sources/, through the chain in
# packs/documentary-history/02_evidence_and_sourcing.md.
# =========================================================================

id: LINE-NG
