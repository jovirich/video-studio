type: studio
id: STU-AFH
code: african-history
title: African History Studio
version: "0.1.0"
status: draft
updated: "2026-08-07"
# --- Canon ---------------------------------------------------------------
# The pack determines what this studio's productions are held to.
# Upgrading a pack major version mid-season is refused by the scaffolder.
pack: documentary-history
pack_version: "0.1.0"
core_version: "0.2.0"

studio_status: opening        # candidate | opening | open | paused | closed

# --- Governance ----------------------------------------------------------
governance:
  showrunner: TBD
  research_lead: TBD
  story_producer: TBD
  visual_director: TBD
  audio_lead: TBD
  rights_and_clearances: TBD
  cultural_advisor: TBD
  pipeline_engineer: TBD

  # core/04 §5 — no person signs two gates on the same production.
  # With fewer than four distinct people this studio cannot ship.
  distinct_signatories_available: 0

editorial_independence:
  final_authority: showrunner
  # The one exception. See packs/documentary-history/07_cultural_sensitivity.md §4.
  advisory_hold_override: not-permitted-unilaterally
  funder_editorial_input: none-accepted
  disclosed_access_conditions: []

# --- Scope ---------------------------------------------------------------
scope:
  subject: >
    Histories of the African continent and its diasporas.
  organised_by: region
  comprehensiveness_claim: none
  # A series cannot cover a continent, and claiming otherwise invites the
  # criticism the work is least able to answer.

# --- Lines ---------------------------------------------------------------
lines:
  - code: ng-nigeria
    order: 1
    status: candidate
    id_scope: NG

