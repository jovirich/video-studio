name: Validate

on:
  push:
    branches: [main, "release/**", "studio/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install toolkit
        run: pip install -e ".[dev]"

      # Implemented gates are blocking. Each runs independently with `if: always()`
      # so a pull request sees every failure at once rather than only the first.
      # Maturity of each gate: automation/README.md and docs/status.md.

      - name: Gate — record schemas
        if: always()
        run: python -m studio_ops validate --schemas

      - name: Gate — naming conventions
        if: always()
        run: python -m studio_ops validate --naming

      - name: Gate — internal links
        if: always()
        run: python -m studio_ops validate --links

      - name: Gate — repository root hygiene
        if: always()
        run: python -m studio_ops validate --root-hygiene

      # Non-blocking, and deliberately visible. `--all` includes the gates that are
      # NOT BUILT (sources, canon, prompts, packs, delivery) and exits 2 because of
      # them. Surfacing that in every run keeps the gap in front of reviewers instead
      # of letting a green build imply that everything was checked.
      - name: Coverage report — including NOT BUILT gates
        if: always()
        continue-on-error: true
        run: |
          python -m studio_ops validate --all || true
          echo "::notice::Gates marked NOT BUILT above are specified but unimplemented."
          echo "::notice::See docs/status.md for the capability ledger."

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        if: always()
        run: ruff check automation
      - name: Format check
        if: always()
        run: ruff format --check automation
      - name: Type check
        if: always()
        run: mypy automation/studio_ops
      - name: Tests
        if: always()
        run: pytest --cov=studio_ops --cov-report=term-missing

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Reject committed credentials
        run: |
          if git ls-files | grep -E '(^|/)\.env$|service_account.*\.json$|\.pem$|\.key$'; then
            echo "::error::A credential-shaped file is tracked in git. Remove it and rotate the secret."
            exit 1
          fi
          echo "No credential-shaped files tracked."
