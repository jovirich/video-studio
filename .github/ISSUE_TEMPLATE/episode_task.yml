name: Episode task
description: A unit of work inside an episode.
title: "[S00E00] "
labels: ["episode"]
body:
  - type: input
    id: episode
    attributes: { label: Episode code, placeholder: "S01E01" }
    validations: { required: true }
  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      options: ["00_brief", "01_research", "02_script", "03_storyboard", "04_prompts", "05_assets", "06_edit", "07_audio_post", "08_review", "09_delivery", "10_publish"]
    validations: { required: true }
  - type: textarea
    id: task
    attributes: { label: What needs doing }
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Be specific enough that someone else can verify it without asking you.
    validations: { required: true }
  - type: dropdown
    id: blocks_gate
    attributes:
      label: Does this block a gate?
      options: ["No", "Script lock", "Fact-check", "Sensitivity", "Rights", "Picture lock", "Audio lock", "Technical QC"]
