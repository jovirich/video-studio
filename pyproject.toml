[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-ops"
version = "0.1.0"
description = "Operations toolkit for African History Studio: scaffolding, validation, reporting, and pipeline stubs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "African History Studio" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
studio = "studio_ops.cli:app"

[tool.setuptools]
package-dir = { "" = "automation" }

[tool.setuptools.packages.find]
where = ["automation"]
include = ["studio_ops*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["automation"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "automation"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["automation/tests"]
pythonpath = ["automation"]
addopts = "-q"
